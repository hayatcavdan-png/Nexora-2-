name: APK Derle
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      # Logo yazı tipi: Orbitron (SIL Open Font License 1.1), Google Fonts deposundan
      - run: |
          mkdir -p android/app/src/main/res/font
          curl -fsSL --retry 3 -o android/app/src/main/res/font/orbitron.ttf "https://github.com/google/fonts/raw/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf"
          ls -la android/app/src/main/res/font
      - run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: nexora-apk, path: android/app/build/outputs/apk/release/app-release.apk }
