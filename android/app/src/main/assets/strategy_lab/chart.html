<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; font:12px sans-serif; color:#d9e6fa; background:#0b1220 }
  #chart { width:100%; height:220px }
  #notice { text-align:center; padding:8px;color:#9caac2 }
  #credit { font-size:10px; text-align:right; padding:0 9px 6px; color:#9caac2 }
  #credit a { color:#9caac2 }
</style>
</head>
<body>
<div id="chart"></div><div id="notice">Geçerli sanal fiyat geçmişi bekleniyor.</div>
<div id="credit">Charts by <a href="https://www.tradingview.com/" rel="noreferrer">TradingView</a> — Lightweight Charts™ (attribution required)</div>
<script src="./lightweight-charts.standalone.production.js"></script>
<script>
(function() {
  "use strict";
  let chart, series;
  const root = document.getElementById('chart');
  const notice = document.getElementById('notice');
  function renderSeries(input) {
    if (!Array.isArray(input) || !window.LightweightCharts) {
      notice.textContent = 'Grafik kütüphanesi veya güvenilir veri mevcut değil.';
      return;
    }
    const data = input.slice(0,1000)
      .filter(x => x && Number.isSafeInteger(x.time) && x.time > 0 &&
                   Number.isFinite(x.value) && x.value > 0)
      .map(x => ({time:x.time, value:x.value}))
      .sort((a,b)=>a.time-b.time);
    if (data.length < 2 || data.some((x,i)=>i>0 && x.time === data[i-1].time)) {
      notice.textContent='Gösterilecek güvenilir sanal veri yok.';
      return;
    }
    if (!chart) {
      chart=LightweightCharts.createChart(root, {
        width: root.clientWidth || 300, height:220,
        layout: { textColor:'#a6b8d2', background: {type:'solid',color:'#0b1220'} },
        grid: { vertLines:{color:'#15243d'},horzLines:{color:'#15243d'} },
        timeScale: { timeVisible:true, secondsVisible:false },
        rightPriceScale: { borderColor:'#223650' },
      });
      series=chart.addSeries(LightweightCharts.LineSeries,
        { color:'#47ded1',lineWidth:2,priceLineVisible:false });
      new ResizeObserver(()=>chart.applyOptions({width:root.clientWidth})).observe(root);
    }
    series.setData(data);
    chart.timeScale().fitContent();
    notice.textContent='Yalnızca sanal ve geçmiş ölçümler; gerçekleşmiş kâr değildir.';
  }
  window.renderSeries=renderSeries;
})();
</script>
</body>
</html>
